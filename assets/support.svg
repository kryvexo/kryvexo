<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Support on Ko-fi" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif"><defs><linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#a3ff12"/><stop offset="1" stop-color="#d6ff7a"/></linearGradient><radialGradient id="g" cx=".05" cy=".5" r=".6"><stop offset="0" stop-color="#a3ff12" stop-opacity=".16"/><stop offset="1" stop-color="#a3ff12" stop-opacity="0"/></radialGradient><clipPath id="c"><rect width="1000" height="150" rx="18"/></clipPath></defs><rect width="1000" height="150" rx="18" fill="#0d0d15"/><g clip-path="url(#c)"><rect width="1000" height="150" fill="url(#g)"/></g><rect x=".5" y=".5" width="999" height="149" rx="18" fill="none" stroke="#262634"/><path d="M70,84 q-6,-10 0,-20 q6,-10 0,-20" fill="none" stroke="#ececf1" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.55;0" dur="2.6s" begin="0.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -8" dur="2.6s" begin="0.0s" repeatCount="indefinite"/></path><path d="M84,84 q-6,-10 0,-20 q6,-10 0,-20" fill="none" stroke="#ececf1" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.55;0" dur="2.6s" begin="0.55s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -8" dur="2.6s" begin="0.55s" repeatCount="indefinite"/></path><path d="M98,84 q-6,-10 0,-20 q6,-10 0,-20" fill="none" stroke="#ececf1" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.55;0" dur="2.6s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -8" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></path><path d="M52,92 h64 v16 a26,26 0 0 1 -26,26 h-12 a26,26 0 0 1 -26,-26Z" fill="#a3ff12"/><path d="M116,98 h8 a10,10 0 0 1 0,22 h-12" fill="none" stroke="#a3ff12" stroke-width="5" stroke-linecap="round"/><text x="170" y="64" font-size="26" font-weight="800" fill="#ececf1" letter-spacing="-.4">If my work helped you, say thanks.</text><text x="170" y="94" font-size="15" fill="#8a8a9e">Support keeps the servers on and the apps updated. Even a coffee helps.</text><text x="170" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#5b5b6e">no pressure, star the repos if that is easier</text><rect x="760" y="48" width="196" height="54" rx="27" fill="url(#b)"/><text x="858" y="82" font-size="16" font-weight="800" fill="#0b0b12" text-anchor="middle">ko-fi.com/maxown</text></svg>